[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
vtx-core = { path = "crates/vtx-core" }
vtx-ui = { path = "crates/vtx-ui" }

eframe = { version = "0.36", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
egui = "0.36"
egui_dock = "0.21"
portable-pty = "0.9"
unicode-width = "0.2"
vte = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
